name: Deploy Nura site to GitHub Pages

# Manual only. The live site is published by Settings -> Pages -> "Deploy from a branch"
# (main, / root), with the root index.html redirecting to frontend/. Running this
# workflow on every push would race that deploy and break the /frontend/ links.
# Use it only if you switch Pages Source to "GitHub Actions" (then delete the root redirect).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
